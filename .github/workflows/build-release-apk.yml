name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      buildVariant:
        description: 'Build variant'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - fullDebug

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Load JDK version
        run: |
          JAVA_VERSION=$(jq -r '.default' .github/jdk-map.json)
          echo "JAVA_VERSION=$JAVA_VERSION" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Decode keystore
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore/keystore.jks"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # ubuntu-latest has 7GB RAM total; keep Gradle + Kotlin daemon within ~5.5GB
          ./gradlew :app:assemble${{ github.event.inputs.buildVariant }} \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC -Xss4m" \
            -Dkotlin.daemon.jvm.options="-Xmx2g -Xss4m" \
            -Dorg.gradle.workers.max=2

      - name: Find APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aaps-${{ github.event.inputs.buildVariant }}
          path: ${{ env.APK_PATH }}
          retention-days: 90
